[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koa-digital-ecosystem-github-audit"
version = "0.2.0"
description = "Read-only GitHub audit of the kOA Digital Ecosystem"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["koa_audit*"]
