name: kOA Graph - publication datee FR EN

# Le site public ne change PAS automatiquement lorsque les depots bougent.
# Seule l'action manuelle de publication peut deployer une nouvelle version.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: selected / all / rollback / republish'
        required: true
        type: choice
        options: [selected, all, rollback, republish]
        default: selected
      repositories:
        description: 'Comma-separated repository names, only for selected (e.g. Kolor,Karacter)'
        required: false
        type: string
        default: 'Kolor,Karacter'
      rollback_release:
        description: 'Existing dated release ID, only for rollback'
        required: false
        type: string
      preview_only:
        description: 'Preview only (true) or publish after approval (false)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: koa-graph-pages-publication
  cancel-in-progress: false

jobs:
  candidate:
    name: Build the frozen, dated candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source and previous publications
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned public docs only
        env:
          PUBLICATION_MODE: ${{ inputs.mode }}
          PUBLICATION_REPOS: ${{ inputs.repositories }}
          ROLLBACK_ID: ${{ inputs.rollback_release }}
        run: |
          python -m koa_audit.publication_snapshots \
            --mode "$PUBLICATION_MODE" \
            --repos "$PUBLICATION_REPOS" \
            --rollback-release "$ROLLBACK_ID"
      - name: Check generated site and freeze artifact
        run: |
          python -m unittest discover -s tests -p 'test_publication_snapshots.py' -v
          python -m unittest discover -s tests -p 'test_graph_public.py' -v
          python -m unittest discover -s tests -p 'test_focus_graph.py' -v
          test -s docs/publications/index.html
          test -s docs/data/publication-current.json
          extras=()
          if [ -f docs/data/graph-public.json ]; then extras+=(docs/data/graph-public.json); fi
          if [ -f docs/data/focus-paths.json ]; then extras+=(docs/data/focus-paths.json); fi
          tar -czf koa-graph-publication-candidate.tar.gz docs/publications docs/data/publication-current.json "${extras[@]}"
      - name: Save candidate for review and repeatable publication
        uses: actions/upload-artifact@v7
        with:
          name: koa-graph-publication-candidate
          path: koa-graph-publication-candidate.tar.gz
          retention-days: 30

  publish:
    name: Publish only after approved deployment
    needs: candidate
    if: ${{ !inputs.preview_only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout same commit used for candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve exactly the prepared candidate
        uses: actions/download-artifact@v4
        with:
          name: koa-graph-publication-candidate
      - name: Install candidate in dated, versioned site directory
        run: |
          tar -xzf koa-graph-publication-candidate.tar.gz
          python - <<'PYCODE'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          file = Path('docs/data/publication-current.json')
          data = json.loads(file.read_text(encoding='utf-8'))
          # During rollback, a release predating focused paths must not inherit
          # a newer, unrelated graph from the checked-out main branch.
          manifest_file = Path('docs/publications/releases') / data['release_id'] / 'manifest.json'
          manifest = json.loads(manifest_file.read_text(encoding='utf-8'))
          if not manifest.get('owner_focus_path'):
              Path('docs/data/focus-paths.json').unlink(missing_ok=True)
          data['deployed_at'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PYCODE
          git add docs/publications docs/data/publication-current.json
          if [ -f docs/data/graph-public.json ]; then git add docs/data/graph-public.json; fi
          if [ -f docs/data/focus-paths.json ] || git ls-files --error-unmatch docs/data/focus-paths.json >/dev/null 2>&1; then git add -A -- docs/data/focus-paths.json; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: publish frozen kOA Graph snapshot (${{ inputs.mode }})'
          git push origin HEAD:main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload exact published tree
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy atomic static site artifact
        id: deployment
        uses: actions/deploy-pages@v4
