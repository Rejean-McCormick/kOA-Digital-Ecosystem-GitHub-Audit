name: Publier le tableau de bord kOA

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: koa-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Uploader le site statique public
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
